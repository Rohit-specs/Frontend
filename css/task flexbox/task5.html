<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            display: flex;
            flex-direction: row;
            height: 98vh ;
            width: 99vw;
            border: 1px solid rgba(128, 128, 128, 0.5);
            border-radius: 7px;
            overflow: hidden;
        }
        .left_container{
            background-color: rgba(0, 0, 0, 0.89);
            justify-content: left;
            width: 20%; 
        }
        .content{
            padding: 10px 20px;
            display: flex;
            overflow: hidden;
            flex-direction: column;
            flex: 1 1 0;
            border: 1px solid;
            row-gap: 40px;
        }

        .box{

            width: 100%;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            padding: 20px;
            min-height: 180px;
        }
        
        .box1{
            height: 120px;
            background-color: rgba(128, 128, 128, 0.5);

        }
        .content .box2{
            display: flex;
            gap: 20;
            flex-grow: 1;
            flex-direction: row;
            background-color: none;
        }
        .box2_left{
            display: flex;
            gap: 20px;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .box2_left_top{
            display: flex;
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(128, 128, 128, 5);
            border-radius: 12px;
            background-color: white;
            gap: 10px;
        }

        .box2_left_top .child_boxes{
            background-color: rgba(128, 128, 128, 0.5);
            border: 2px solid rgba(128, 128, 128, 0.5);
            width: 120px;
            aspect-ratio: 1/1;
            border-radius: 8px;

        }
        .box2_left_bottom{
            display: flex;
            width: 80%;
            padding: 8px;
            border: 1px solid rgba(128, 128, 128, 5);
            border-radius: 12px;
            gap: 10px;
        }
        .box2_left_bottom div{
            background-color: rgba(128, 128, 128, 0.5);
            width: 50%;
            aspect-ratio: 1/.8;
            border-radius: 12px ;
        }
        .box2_left_bottom .child_box2{
            height: 80%;
            
        }



        
    </style>
</head>
<body>
    <div class="container">
        <div class="left_container"></div>
        <div class="content">
            <!-- <div class="header">header</div> -->
            <div class="box1 box"></div>
            <div class="box2 box" >
                <div class="box2_left">
                    <div class="box2_left_top">
                        <div class="child_boxes"></div>
                        <div class="child_boxes"></div>
                        <div class="child_boxes"></div>
                    </div>
                    <div class="box2_left_bottom">
                        <div class="child_box1">sdf</div>
                        <div class="child_box2">sdf</div>
                    </div>

                </div>
                <div class="box2_right">
                    <div class="box2_right_top">sdf</div>
                    <div class="box2_right_bottom">sdf</div>
                </div>

            </div>
            <div class="box3 box">
                <div class="1"></div>
                <div class="2">
                    <div class="box1"></div>
                    <div class="box2"></div>
                </div>
                <div class="3"></div>
                <div class="4"></div>
                <div class="5"></div>
            </div>
        </div>
    </div>
</body>
</html>
