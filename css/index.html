<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>just learning basic of CSS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Learning CSS Selectors</h1>
    </header>
    <section>
      <h2 id="using_id_selector">This is first heading</h2>
      <p class="content">content</p>
    </section>
    <section class="group_selector">
      <p>I am Iron Man</p>
      <ul>
        <li>Thor</li>
        <li>Captian America</li>
        <li>Hulk</li>
        <li>Hawkeye</li>
        <li>Black Widow</li>
      </ul>
    </section>
    <section class="attribute_selector">
      <button type="button" role="button">hit me</button>
    </section>
    <section class="descendant_selector">
      <span>Sachin is the Best Batsman in the world</span>
    </section>
  </body>
</html>
