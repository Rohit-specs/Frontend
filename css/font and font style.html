<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

        /* @font-face {
            font-family: 'Roboto';

        body{

        .style{

        }

            font: optional;
        } */

</head>
<body>
    <header><h1>Font and Fonts Style</h1></header>
    <main>
        <section class="font_section">

        </section>
        <section class="font_style">
            <h2>Font Style</h2>

            <p class="style">Font Style</p>
            <p class="small-caps">Font small-caps</p>
            <p class="shorthand">Font Short-hand</p>

    </main>
