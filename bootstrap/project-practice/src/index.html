<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script type="module" src="./js/main.js"></script>

</head>

<body>
  <header>
    <div class="header-top py-2">
      <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
          <div class="left-panel d-flex gap-4 justify-content-around">
            <a class="text-white" href="tel: 123456789"><i class="fa-solid fa-phone-volume"></i> +1 23456789</a>
            <a class="text-white" href="mailto: example@gmail.com"><i class="fa-solid fa-envelope"></i>
              example@gmail.com</a>
          </div>
          <div class="right-panel d-flex gap-4 text-white justify-content-around">
            <a href="#" class="icon-link"><span class="rounded-icon icon-sm text-white"><i class="fa-solid fa-user"></i>
                Login / Register </span></a>
            <div class="vr border-2 text-white"></div>
            <div class="social-icons d-flex gap-2">
              <a href="#" class="icon icon-sm btn btn-white" target="_blank"
                aria-label="Click here to visit Our Facebook Page"><i class="fa-brands fa-facebook-f"></i></a>
              <a href="#" class="icon icon-sm btn btn-white" target="_blank"
                aria-label="Click here to visit Our X Page"><i class="fa-brands fa-x-twitter"></i></a>
              <a href="#" class="icon icon-sm btn btn-white" target="_blank"
                aria-label="Click here to visit Our Youtube Channel"><i class="fa-brands fa-youtube"></i></a>
              <a href="#" class="icon icon-sm btn btn-white" target="_blank"
                aria-label="Click here to visit Our Instagram Page"><i class="fa-brands fa-instagram"></i></a>
            </div>


          </div>
        </div>
      </div>
    </div>
    <div class="header-bottom">
      <div class="container">
          <nav class="navbar bg-white navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="#" aria-label="Go to home page"><img src="./images/logo.svg" alt="travelsy logo"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse gap-lg-4" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Host A Venue</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Hotels</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Blog</a>
                        </li>
                    </ul>
                    <div class="d-flex gap-3">                        
                        <button class="btn btn-outline-primary icon icon-lg">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                        <a class="btn btn-primary icon-link rounded-pill" href="#">Contact Us <i class="fa-solid fa-phone-volume"></i></a>
                        </div>
                </div>
            </div>
        </nav>
      </div>
    </div>
  </header>
</body>

</html>
